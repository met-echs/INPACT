version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: inpact_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-inpact_db}
      POSTGRES_USER: ${DB_USER:-inpact_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-inpact_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inpact_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-inpact_db}
      - DB_USER=${DB_USER:-inpact_user}
      - DB_PASSWORD=${DB_PASSWORD:-inpact_password}
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db

volumes:
  postgres_data:
